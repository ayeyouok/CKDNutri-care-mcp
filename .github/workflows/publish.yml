name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  pypi-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Clean previous builds
        run: rm -rf dist/
      - name: Check a207-policy dependency resolvable on PyPI
        # 读取 pyproject 中声明的 a207-policy 最低版本（floor），轮询直到 PyPI 上出现
        # 任一 >= floor 的版本（对齐 clinical-data 的 Wait 步骤）。此前硬编码检查
        # '0.3.28'（2026-08-22 修正）：BUG-69/70 修复发布新共享层后，若 floor
        # （如 >=0.3.49）尚未在 PyPI，pip install -e . 会解析失败——必须先等
        # a207-policy 发布完成再继续。最长等待 10 分钟。
        run: |
          python - <<'PY'
          import urllib.request, json, re, sys, time
          txt = open('pyproject.toml').read()
          m = re.search(r'a207-policy>=(\d+\.\d+\.\d+)', txt)
          if not m:
              print("ERROR: cannot find a207-policy floor in pyproject.toml", file=sys.stderr); sys.exit(1)
          floor = tuple(map(int, m.group(1).split('.')))
          print(f"waiting for a207-policy>={m.group(1)} on PyPI ...")
          deadline = time.time() + 600
          while True:
              try:
                  d = json.load(urllib.request.urlopen('https://pypi.org/pypi/a207-policy/json', timeout=20))
              except Exception as e:
                  print(f"PyPI query failed ({e}), retrying...")
              else:
                  vers = [tuple(map(int, v.split('.'))) for v in d['releases'] if re.fullmatch(r'\d+\.\d+\.\d+', v)]
                  if any(v >= floor for v in vers):
                      print(f"a207-policy>={m.group(1)} available on PyPI"); break
              if time.time() > deadline:
                  print(f"ERROR: a207-policy>={m.group(1)} not on PyPI after 10 min — publish a207-policy first, then re-run this workflow", file=sys.stderr); sys.exit(1)
              time.sleep(15)
          PY
      - name: Run tests (X2, 2026-08-14)
        run: |
          python -m pip install --upgrade pip --user
          python -m pip install -e . --user
          export A207_STORAGE_BACKEND=json
          for f in tests/test_*.py; do python "$f" || exit 1; done
      - name: Install build
        run: python -m pip install build --user
      - name: Build package
        run: python -m build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

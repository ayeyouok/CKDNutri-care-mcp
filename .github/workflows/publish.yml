name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  pypi-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Clean previous builds
        run: rm -rf dist/
      - name: Check a207-policy dependency resolvable on PyPI
        run: |
          python -c "import urllib.request,json; d=json.load(urllib.request.urlopen('https://pypi.org/pypi/a207-policy/json')); assert '0.3.16' in d['releases'], 'a207-policy==0.3.16 未发布到 PyPI，必须先发布 a207-policy 再发布本包'"
      - name: Install build
        run: python -m pip install build --user
      - name: Build package
        run: python -m build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

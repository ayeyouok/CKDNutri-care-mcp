[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CKDNutri-care-mcp"
version = "0.4.24"
description = "P3 随访沟通域——随访+通知+闭环工单"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2",
    "a207-policy>=0.3.17",
    "tablestore>=6.4",
]

[project.scripts]
CKDNutri-care-mcp = "CKDNutri_care_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行超长不阻断（存量历史注释多），仅提示

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # 测试：sys.path/env 设置在 import 前（既有标准模式）

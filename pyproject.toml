[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CKDNutri-care-mcp"
version = "0.4.8"
description = "P3 随访沟通域——随访+通知+闭环工单"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2",
    "a207-policy>=0.3.17",
    "tablestore>=6.4",
]

[project.scripts]
CKDNutri-care-mcp = "CKDNutri_care_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
